<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="dash">

    <div class="top-bar">
      <h1>📊 Crypto Dashboard</h1>
      <div class="clocks">
        <div class="clock-item">
          <div class="clock-label">تهران</div>
          <div class="clock-time" id="clock-tehran"></div>
        </div>
        <div class="clock-item">
          <div class="clock-label">نیویورک</div>
          <div class="clock-time" id="clock-ny"></div>
        </div>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-label">Bitcoin (BTC)</div>
        <div class="card-value" id="btc-price">...</div>
        <div class="card-sub" id="btc-change">...</div>
      </div>
      <div class="card">
        <div class="card-label">Ethereum (ETH)</div>
        <div class="card-value" id="eth-price">...</div>
        <div class="card-sub" id="eth-change">...</div>
      </div>
      <div class="card">
        <div class="card-label">Solana (SOL)</div>
        <div class="card-value" id="sol-price">...</div>
        <div class="card-sub" id="sol-change">...</div>
      </div>
      <div class="card">
        <div class="card-label">BNB</div>
        <div class="card-value" id="bnb-price">...</div>
        <div class="card-sub" id="bnb-change">...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">نمودار قیمت لحظه‌ای — BTC</div>
      <div style="position:relative; width:100%; height:220px;">
        <canvas id="priceChart" role="img" aria-label="نمودار قیمت بیتکوین ۷ روز گذشته"></canvas>
      </div>
    </div>

    <div class="panel" style="margin-top: 1rem;">
      <div class="panel-title">بازار</div>
      <div id="coin-list"></div>
    </div>

  </div>
          <h2>created by arad vafaee</h2>

  <footer>
    <div class="footer-line"></div>
    <div class="footer-content">
        <!-- <h2>created by arad vafaee</h2> -->

        <span>📞 Call me: <a href="tel:09394606013">09394606013</a></span>

    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
